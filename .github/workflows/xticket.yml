name: xticket-camp-notify

on:
  schedule:
    # cron은 UTC 기준. KST = UTC+9.
    # 무료 한도(2000분/월) 안에 맞추려 시간대별로 주기를 다르게 둔다.
    #   야간 KST 00~06시(= UTC 15~21시): 1시간마다  -> 하루 6회
    #   주간 KST 07~23시(= UTC 22,23,0~14시): 20분마다 -> 하루 54회
    # 합계 약 60회/일 x 30일 = ~1800분/월 (무료 2000분 이내)
    # (GitHub 무료 스케줄은 실제로는 몇 분~십수 분 지연될 수 있음)
    - cron: "0 15-21 * * *"          # 야간(KST 00~06시) 매시 정각
    - cron: "*/20 22,23,0-14 * * *"  # 주간(KST 07~23시) 20분마다
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      weekday:
        description: "감시 요일 (sat/tue/1 등)"
        default: "sat"
      notify_always:
        description: "잔여 없어도 알림 보낼지 (1=보냄, 수동 테스트용)"
        default: "0"
      watch_sunday_deck:
        description: "일요일 데크(이번달)도 감시할지 (1=감시, 수동 실행용)"
        default: "0"

concurrency:
  group: xticket-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKDAY: ${{ github.event.inputs.weekday || 'sat' }}
          NOTIFY_ALWAYS: ${{ github.event.inputs.notify_always || '0' }}
          # ▼▼▼ 일요일 데크 감시 토글: 평소엔 '0'(끔). 켜려면 이 '0'을 '1'로 바꿔 push. ▼▼▼
          WATCH_SUNDAY_DECK: ${{ github.event.inputs.watch_sunday_deck || '0' }}
        run: python3 notify_telegram.py
